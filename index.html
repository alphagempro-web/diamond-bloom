<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Diamond Bloom</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#000;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
font-family:Arial,sans-serif;
}

#intro{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#000;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
animation:introHide 4s forwards;
}

#diamond{
font-size:90px;
animation:spin 2s linear infinite;
filter:drop-shadow(0 0 25px cyan);
}

@keyframes spin{
0%{transform:rotate(0deg) scale(.8);}
50%{transform:rotate(180deg) scale(1.2);}
100%{transform:rotate(360deg) scale(.8);}
}

@keyframes introHide{
0%,80%{
opacity:1;
}

100%{
opacity:0;
visibility:hidden;
}
}

#bouquet{
width:320px;
opacity:0;
animation:show 2s forwards;
animation-delay:4s;
}

@keyframes show{
from{
opacity:0;
transform:scale(.4);
filter:blur(10px);
}
to{
opacity:1;
transform:scale(1);
filter:blur(0);
}
}

h1{
position:absolute;
bottom:20px;
width:100%;
text-align:center;
color:white;
font-size:24px;
opacity:0;
animation:textShow 2s forwards;
animation-delay:5s;
text-shadow:0 0 20px cyan;
}

@keyframes textShow{
to{
opacity:1;
}
}

</style>

</head>

<body>

<div id="intro">
<div id="diamond">💎</div>
</div>

<img id="bouquet"
src="file_000000002350823084bd6f6f6fce94c3.png">

<h1>✨ Some Moments Deserve To Shine Forever ✨</h1>

</body>
</html>
