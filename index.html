<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💎 The Diamond Bloom</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#000;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:Arial,sans-serif;
}

/* INTRO */

#intro{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
animation:introHide 4s forwards;
}

#diamond{
font-size:90px;
animation:pulse 1.5s infinite;
filter:drop-shadow(0 0 30px cyan);
}

@keyframes pulse{
0%{transform:scale(.8) rotate(0deg);}
50%{transform:scale(1.15) rotate(180deg);}
100%{transform:scale(.8) rotate(360deg);}
}

@keyframes introHide{
  #flash{
position:fixed;
top:50%;
left:50%;
width:20px;
height:20px;
border-radius:50%;
background:white;
transform:translate(-50%,-50%) scale(0);
opacity:0;
box-shadow:0 0 40px white,0 0 120px cyan;
animation:flash 1s forwards;
animation-delay:3.8s;
z-index:9998;
}

@keyframes flash{
0%{
opacity:0;
transform:translate(-50%,-50%) scale(0);
}
40%{
opacity:1;
transform:translate(-50%,-50%) scale(20);
}
100%{
opacity:0;
transform:translate(-50%,-50%) scale(35);
}
}

@keyframes floatBouquet{
0%,100%{
transform:translateY(0);
}
50%{
transform:translateY(-10px);
}
}
0%,80%{
opacity:1;
}
100%{
opacity:0;
visibility:hidden;
}
}

/* BOUQUET */

#bouquet{
width:320px;
opacity:0;
transform:scale(.2);
filter:blur(10px);
animation:showBouquet 2s forwards;
animation-delay:4s;
}

@keyframes showBouquet{

0%{
opacity:0;
transform:scale(.2);
filter:blur(10px);
}

100%{
opacity:1;
transform:scale(1);
filter:blur(0);
}

}

/* TEXT */

h1{

position:absolute;

bottom:35px;

color:white;

font-size:24px;

text-shadow:0 0 20px cyan;

opacity:0;

animation:textShow 2s forwards;

animation-delay:5.5s;

}

@keyframes textShow{

to{

opacity:1;

}

}
/* DIAMOND STARS */

.star{
position:fixed;
width:3px;
height:3px;
background:white;
border-radius:50%;
box-shadow:0 0 10px cyan;
animation:float 8s linear infinite;
opacity:.8;
}

@keyframes float{

0%{
transform:translateY(100vh);
opacity:0;
}

20%{
opacity:1;
}

100%{
transform:translateY(-120vh);
opacity:0;
}

}

/* BACKGROUND GLOW */

body::before{

content:"";

position:fixed;

width:600px;

height:600px;

background:radial-gradient(circle,rgba(0,255,255,.18),transparent);

filter:blur(90px);

animation:bgmove 12s infinite alternate;

}

@keyframes bgmove{

0%{
transform:translate(-180px,-100px);
}

100%{
transform:translate(180px,120px);
}

  }
</style>

</head>

<body>

<div id="intro">

<div id="diamond">💎</div>

</div>

<img id="bouquet" src="file_000000002350823084bd6f6f6fce94c3.png">

<h1>✨ Some Moments Deserve To Shine Forever ✨</h1>
<script>

for(let i=0;i<120;i++){

let s=document.createElement("div");

s.className="star";

s.style.left=Math.random()*100+"vw";

s.style.animationDelay=Math.random()*8+"s";

s.style.animationDuration=(5+Math.random()*6)+"s";

document.body.appendChild(s);

}

</script>
</body>
</html>
