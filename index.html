<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💎 The Diamond Bloom</title>

<style>
body{
    margin:0;
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
    color:white;
    font-family:Arial,sans-serif;
}

img{
    width:320px;
    animation:glow 2s infinite alternate;
}

h1{
    position:absolute;
    bottom:40px;
    text-shadow:0 0 20px cyan;
}

@keyframes glow{
    from{
        transform:scale(1);
        filter:drop-shadow(0 0 10px white);
    }
    to{
        transform:scale(1.05);
        filter:drop-shadow(0 0 35px cyan);
    }
}
</style>
</head>

<body>

<img id="bouquet" src="file_000000002350823084bd6f6f6fce94c3.png">

<h1>✨ Some Moments Deserve To Shine Forever ✨</h1>

</body>
  </html>
