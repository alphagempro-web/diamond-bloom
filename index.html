<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Diamond Bloom</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#000;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
font-family:Arial,sans-serif;
}

#intro{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#000;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
animation:introHide 4s forwards;
}

#diamond{
font-size:90px;
animation:spin 2s linear infinite;
filter:drop-shadow(0 0 25px cyan);
}

@keyframes spin{
0%{transform:rotate(0deg) scale(.8);}
50%{transform:rotate(180deg) scale(1.2);}
100%{transform:rotate(360deg) scale(.8);}
}

@keyframes introHide{
0%,80%{
opacity:1;
}

100%{
opacity:0;
visibility:hidden;
}
}

#bouquet{
width:320px;
opacity:0;

animation:
show 2s forwards,
floatBouquet 4s ease-in-out infinite;

animation-delay:
4s,
6s;
}

@keyframes show{
from{
opacity:0;
transform:scale(.4);
filter:blur(10px);
}
to{
opacity:1;
transform:scale(1);
filter:blur(0);
}
}

h1{
position:absolute;
left:50%;
bottom:25px;
transform:translateX(-50%);
width:90%;
text-align:center;
color:#ffffff;
font-size:24px;
font-weight:bold;
letter-spacing:2px;
opacity:0;
animation:textShow 2s forwards;
animation-delay:5s;
text-shadow:
0 0 8px #ffffff,
0 0 18px #8eefff,
0 0 35px #00e5ff,
0 0 55px #00e5ff;
}

@keyframes textShow{
to{
opacity:1;
}
}
.star{
position:fixed;
width:3px;
height:3px;
background:white;
border-radius:50%;
box-shadow:0 0 8px cyan;
animation:starMove linear infinite;
}

@keyframes starMove{
0%{
transform:translateY(110vh);
opacity:0;
}
20%{
opacity:1;
}
100%{
transform:translateY(-120vh);
opacity:0;
}
}

body::before{
content:"";
position:fixed;
width:600px;
height:600px;
background:radial-gradient(circle,rgba(0,255,255,.18),transparent);
filter:blur(90px);
animation:bgGlow 10s infinite alternate;
}

@keyframes bgGlow{
0%{
transform:translate(-180px,-100px);
}
100%{
transform:translate(180px,100px);
}
}

@keyframes floatBouquet{
0%,100%{
transform:translateY(0px);
}
50%{
transform:translateY(-12px);
}
  }
  #flash{
position:fixed;
top:50%;
left:50%;
width:20px;
height:20px;
background:white;
border-radius:50%;
transform:translate(-50%,-50%) scale(0);
opacity:0;
box-shadow:0 0 50px white,0 0 150px cyan;
animation:flash 1s forwards;
animation-delay:3.8s;
z-index:9998;
pointer-events:none;
}

@keyframes flash{
0%{
opacity:0;
transform:translate(-50%,-50%) scale(0);
}
40%{
opacity:1;
transform:translate(-50%,-50%) scale(18);
}
100%{
opacity:0;
transform:translate(-50%,-50%) scale(35);
}
  }
</style>

</head>

<body>

<div id="intro">
<div id="diamond">💎</div>
</div>
<div id="flash"></div>
<img id="bouquet"
src="file_000000002350823084bd6f6f6fce94c3.png">

<h1>✨ Some Moments Deserve To Shine Forever ✨</h1>
<script>

for(let i=0;i<100;i++){

let s=document.createElement("div");

s.className="star";

s.style.left=Math.random()*100+"vw";

s.style.animationDuration=(5+Math.random()*6)+"s";

s.style.animationDelay=Math.random()*8+"s";

document.body.appendChild(s);

}

</script>
  
  <script>
const diamond = document.getElementById("diamond");

diamond.addEventListener("click", function(){

    diamond.style.transform = "scale(1.3) rotate(360deg)";
    diamond.style.filter = "drop-shadow(0 0 60px white)";

    setTimeout(function(){

        diamond.style.transform = "";
        diamond.style.filter = "drop-shadow(0 0 25px cyan)";

    },600);

});
  </script>
</body>
</html>
